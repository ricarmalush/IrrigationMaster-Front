<div class="card">
    <p-toolbar styleClass="mb-4">
        <ng-template pTemplate="start">
            <h5 class="m-0">Festivos</h5>
        </ng-template>
        <ng-template pTemplate="end">
            <button pButton type="button" label="Nuevo festivo" icon="pi pi-plus" routerLink="/system-settings/holidays/new"></button>
        </ng-template>
    </p-toolbar>

    @if (errorMessage()) {
        <p-message severity="error" [text]="errorMessage()!" styleClass="mb-4 w-full"></p-message>
    }

    <p-table
        [value]="holidays()"
        [lazy]="true"
        [paginator]="true"
        [rows]="10"
        [totalRecords]="totalRecords()"
        [loading]="loading()"
        (onLazyLoad)="onLazyLoad($event)"
        dataKey="id"
        [rowsPerPageOptions]="[10, 20, 50]"
        [stripedRows]="true"
        [rowHover]="true"
        responsiveLayout="scroll"
    >
        <ng-template pTemplate="header">
            <tr>
                <th>Fecha</th>
                <th>Descripción</th>
                <th>Tipo</th>
                <th style="width: 8rem"></th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-holiday>
            <tr>
                <td>{{ holiday.date | date: 'dd/MM/yyyy' }}</td>
                <td>{{ holiday.description }}</td>
                <td>
                    <p-tag [severity]="holiday.isNationalHoliday ? 'info' : 'secondary'" [value]="holiday.isNationalHoliday ? 'Nacional' : 'Local'"></p-tag>
                </td>
                <td>
                    <button pButton type="button" icon="pi pi-pencil" class="p-button-text p-button-rounded" [routerLink]="['/system-settings/holidays', holiday.id]"></button>
                    <button pButton type="button" icon="pi pi-trash" class="p-button-text p-button-rounded p-button-danger" (click)="confirmDelete(holiday)"></button>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="4" class="text-center">No hay festivos registrados.</td>
            </tr>
        </ng-template>
    </p-table>
</div>
