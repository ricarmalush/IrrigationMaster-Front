<div class="card">
    <h5>Avisar a mi comunidad</h5>
    <p class="text-muted-color mb-4">Envía un aviso a tu andador o a toda tu organización.</p>

    @if (!canEdit) {
        <p-message severity="warn" text="No tienes permiso para enviar avisos a la comunidad." styleClass="mb-4 w-full"></p-message>
    }

    @if (errorMessage()) {
        <p-message severity="error" [text]="errorMessage()!" styleClass="mb-4 w-full"></p-message>
    }

    <form [formGroup]="form" (ngSubmit)="send()">
        <div class="flex flex-col gap-2 mb-6">
            <label for="audience" class="text-sm font-semibold">Destinatarios</label>
            <p-select id="audience" formControlName="audience" [options]="audienceOptions()" optionLabel="label" optionValue="value" styleClass="w-full"></p-select>
        </div>

        <div class="flex flex-col gap-2 mb-6">
            <label for="message" class="text-sm font-semibold">Mensaje</label>
            <textarea pTextarea id="message" formControlName="message" rows="5" class="w-full" placeholder="Escribe el aviso para tu comunidad..."></textarea>
            @if (form.controls.message.invalid && form.controls.message.touched) {
                <small class="text-red-500 text-sm">El mensaje es obligatorio.</small>
            }
        </div>

        @if (canEdit) {
            <div class="flex justify-end gap-3">
                <button pButton type="button" label="Cancelar" severity="secondary" (click)="cancel()"></button>
                <button pButton type="submit" label="Enviar aviso" [loading]="sending()"></button>
            </div>
        }
    </form>
</div>
