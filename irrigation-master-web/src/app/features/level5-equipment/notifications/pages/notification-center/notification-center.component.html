<div class="card">
    <p-toolbar styleClass="mb-4">
        <ng-template pTemplate="start">
            <h5 class="m-0">Mis notificaciones</h5>
        </ng-template>
        <ng-template pTemplate="end">
            <button pButton type="button" label="Marcar todas como leídas" icon="pi pi-check" severity="secondary" [loading]="markingAllAsRead()" (click)="markAllAsRead()"></button>
        </ng-template>
    </p-toolbar>

    @if (errorMessage()) {
        <p-message severity="error" [text]="errorMessage()!" styleClass="mb-4 w-full"></p-message>
    }

    <p-table
        [value]="notifications()"
        [lazy]="true"
        [paginator]="true"
        [rows]="10"
        [totalRecords]="totalRecords()"
        [loading]="loading()"
        (onLazyLoad)="onLazyLoad($event)"
        dataKey="id"
        [rowsPerPageOptions]="[10, 20, 50]"
        [stripedRows]="true"
        [rowHover]="true"
        responsiveLayout="scroll"
    >
        <ng-template pTemplate="header">
            <tr>
                <th style="width: 2rem"></th>
                <th>Título</th>
                <th>Mensaje</th>
                <th>Tipo</th>
                <th>Fecha</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-notification>
            <tr class="cursor-pointer" (click)="selectNotification(notification)">
                <td>
                    @if (!notification.isRead) {
                        <span class="inline-block w-2 h-2 rounded-full bg-primary"></span>
                    }
                </td>
                <td [class.font-bold]="!notification.isRead" [class.text-muted-color]="notification.isRead">{{ notification.title }}</td>
                <td [class.text-muted-color]="notification.isRead">{{ notification.message }}</td>
                <td>
                    <p-tag [severity]="typeSeverity(notification.type)" [value]="typeLabel(notification.type)"></p-tag>
                </td>
                <td>{{ notification.created | date: 'dd/MM/yyyy HH:mm' }}</td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="5" class="text-center">No hay notificaciones que mostrar.</td>
            </tr>
        </ng-template>
    </p-table>
</div>
