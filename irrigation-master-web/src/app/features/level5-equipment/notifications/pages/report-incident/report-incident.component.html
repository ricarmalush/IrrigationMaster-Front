<div class="card">
    <h5>Reportar incidencia</h5>
    <p class="text-muted-color mb-4">Se enviará a los responsables de tu organización.</p>

    @if (errorMessage()) {
        <p-message severity="error" [text]="errorMessage()!" styleClass="mb-4 w-full"></p-message>
    }

    <form [formGroup]="form" (ngSubmit)="send()">
        <div class="flex flex-col gap-2 mb-6">
            <label for="message" class="text-sm font-semibold">Descripción</label>
            <textarea pTextarea id="message" formControlName="message" rows="5" class="w-full" placeholder="Describe la incidencia..."></textarea>
            @if (form.controls.message.invalid && form.controls.message.touched) {
                <small class="text-red-500 text-sm">La descripción es obligatoria.</small>
            }
        </div>

        <div class="flex justify-end gap-3">
            <button pButton type="button" label="Cancelar" severity="secondary" (click)="cancel()"></button>
            <button pButton type="submit" label="Enviar incidencia" [loading]="sending()"></button>
        </div>
    </form>
</div>
