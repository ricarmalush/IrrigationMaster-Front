<div class="card">
    <p-toolbar styleClass="mb-4">
        <ng-template pTemplate="start">
            <h5 class="m-0">Eventos del sistema</h5>
        </ng-template>
        <ng-template pTemplate="end">
            @if (isSuperAdmin) {
                <div class="flex align-items-center gap-2">
                    <p-datepicker [ngModel]="reportFromDate()" (ngModelChange)="reportFromDate.set($event)" dateFormat="dd/mm/yy" styleClass="w-10rem"></p-datepicker>
                    <span>-</span>
                    <p-datepicker [ngModel]="reportToDate()" (ngModelChange)="reportToDate.set($event)" dateFormat="dd/mm/yy" styleClass="w-10rem"></p-datepicker>
                    <button
                        pButton
                        type="button"
                        label="Descargar informe"
                        icon="pi pi-file-pdf"
                        severity="secondary"
                        [loading]="downloadingReport()"
                        (click)="downloadReport()"
                    ></button>
                </div>
            }
        </ng-template>
    </p-toolbar>

    @if (!isSuperAdmin) {
        <p-message severity="warn" text="No tienes permiso para ver el registro de eventos del sistema." styleClass="mb-4 w-full"></p-message>
    } @else {
        @if (errorMessage()) {
            <p-message severity="error" [text]="errorMessage()!" styleClass="mb-4 w-full"></p-message>
        }

        <p-table
            [value]="events()"
            [lazy]="true"
            [paginator]="true"
            [rows]="10"
            [totalRecords]="totalRecords()"
            [loading]="loading()"
            (onLazyLoad)="onLazyLoad($event)"
            dataKey="id"
            [rowsPerPageOptions]="[10, 20, 50]"
            [stripedRows]="true"
            [rowHover]="true"
            responsiveLayout="scroll"
        >
            <ng-template pTemplate="header">
                <tr>
                    <th>Fecha y hora (UTC)</th>
                    <th>Tipo</th>
                    <th>Descripción</th>
                    <th>Origen</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-event>
                <tr>
                    <td>{{ event.occurredAt | date: 'dd/MM/yyyy HH:mm:ss' : 'UTC' }}</td>
                    <td>
                        <p-tag [severity]="typeSeverity(event)" [value]="typeLabel(event)"></p-tag>
                    </td>
                    <td>{{ event.description }}</td>
                    <td>{{ event.triggeredBy }}</td>
                </tr>
            </ng-template>
            <ng-template pTemplate="emptymessage">
                <tr>
                    <td colspan="4" class="text-center">No hay eventos del sistema registrados.</td>
                </tr>
            </ng-template>
        </p-table>
    }
</div>
