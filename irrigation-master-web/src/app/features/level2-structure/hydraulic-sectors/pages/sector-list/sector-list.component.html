<div class="card">
    <p-toolbar styleClass="mb-4">
        <ng-template pTemplate="start">
            <h5 class="m-0">Sectores hidráulicos</h5>
        </ng-template>
        <ng-template pTemplate="end">
            <button pButton type="button" label="Nuevo sector" icon="pi pi-plus" routerLink="/hydraulic-sectors/new"></button>
        </ng-template>
    </p-toolbar>

    @if (errorMessage()) {
        <p-message severity="error" [text]="errorMessage()!" styleClass="mb-4 w-full"></p-message>
    }

    <p-table
        [value]="sectors()"
        [lazy]="true"
        [paginator]="true"
        [rows]="10"
        [totalRecords]="totalRecords()"
        [loading]="loading()"
        (onLazyLoad)="onLazyLoad($event)"
        dataKey="id"
        [rowsPerPageOptions]="[10, 20, 50]"
        responsiveLayout="scroll"
    >
        <ng-template pTemplate="header">
            <tr>
                <th>Nombre</th>
                <th>Área (ha)</th>
                <th style="width: 8rem"></th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-sector>
            <tr>
                <td>{{ sector.name }}</td>
                <td>{{ sector.areaSize }}</td>
                <td>
                    <button pButton type="button" icon="pi pi-pencil" class="p-button-text p-button-rounded" [routerLink]="['/hydraulic-sectors', sector.id]"></button>
                    <button pButton type="button" icon="pi pi-trash" class="p-button-text p-button-rounded p-button-danger" (click)="confirmDelete(sector)"></button>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="3" class="text-center">No hay sectores que mostrar.</td>
            </tr>
        </ng-template>
    </p-table>
</div>
