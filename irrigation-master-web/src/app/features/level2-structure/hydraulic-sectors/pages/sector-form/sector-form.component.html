<div class="card">
    <h5>{{ isEditMode() ? 'Editar sector' : 'Nuevo sector' }}</h5>

    @if (errorMessage()) {
        <p-message severity="error" [text]="errorMessage()!" styleClass="mb-4 w-full"></p-message>
    }

    <form [formGroup]="form" (ngSubmit)="save()">
        <div class="formgrid grid">
            <div class="field col-12 md:col-6">
                <label for="name">Nombre</label>
                <input pInputText id="name" formControlName="name" class="w-full" />
                @if (form.controls.name.invalid && form.controls.name.touched) {
                    <small class="p-error">El nombre es obligatorio.</small>
                }
            </div>

            <div class="field col-12 md:col-6">
                <label for="areaSize">Área (ha)</label>
                <p-inputnumber id="areaSize" formControlName="areaSize" [minFractionDigits]="0" [maxFractionDigits]="2" styleClass="w-full" inputStyleClass="w-full"></p-inputnumber>
                @if (form.controls.areaSize.invalid && form.controls.areaSize.touched) {
                    <small class="p-error">El área debe ser mayor que 0.</small>
                }
            </div>
        </div>

        <div class="flex gap-2 justify-content-end">
            <button pButton type="button" label="Cancelar" class="p-button-text" (click)="cancel()"></button>
            <button pButton type="submit" [label]="isEditMode() ? 'Guardar cambios' : 'Crear sector'" [loading]="saving()" [disabled]="loading()"></button>
        </div>
    </form>
</div>
