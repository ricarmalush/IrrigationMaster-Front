<div class="card">
    <h5>{{ isEditMode() ? 'Editar organización' : 'Nueva organización' }}</h5>

    @if (errorMessage()) {
        <p-message severity="error" [text]="errorMessage()!" styleClass="mb-4 w-full"></p-message>
    }

    <form [formGroup]="form" (ngSubmit)="save()">
        <div class="formgrid grid">
            <div class="field col-12 md:col-6">
                <label for="name">Nombre</label>
                <input pInputText id="name" formControlName="name" class="w-full" />
                @if (form.controls.name.invalid && form.controls.name.touched) {
                    <small class="p-error">El nombre es obligatorio.</small>
                }
            </div>

            <div class="field col-12 md:col-6">
                <label for="taxId">CIF/NIF</label>
                <input pInputText id="taxId" formControlName="taxId" class="w-full" />
                @if (form.controls.taxId.invalid && form.controls.taxId.touched) {
                    <small class="p-error">El CIF/NIF es obligatorio.</small>
                }
            </div>

            <div formGroupName="address" class="grid col-12 formgrid">
                <div class="field col-12 md:col-6">
                    <label for="mainAddress">Dirección</label>
                    <input pInputText id="mainAddress" formControlName="mainAddress" class="w-full" />
                </div>

                <div class="field col-12 md:col-6">
                    <label for="city">Ciudad</label>
                    <input pInputText id="city" formControlName="city" class="w-full" />
                </div>

                <div class="field col-12 md:col-4">
                    <label for="stateOrProvince">Provincia</label>
                    <input pInputText id="stateOrProvince" formControlName="stateOrProvince" class="w-full" />
                </div>

                <div class="field col-12 md:col-4">
                    <label for="postalCode">Código postal</label>
                    <input pInputText id="postalCode" formControlName="postalCode" class="w-full" />
                </div>

                <div class="field col-12 md:col-4">
                    <label for="countryId">País</label>
                    <p-select
                        id="countryId"
                        formControlName="countryId"
                        [options]="countries()"
                        optionLabel="name"
                        optionValue="id"
                        [loading]="countriesLoading()"
                        placeholder="Selecciona un país"
                        styleClass="w-full"
                    ></p-select>
                </div>

                <div class="field col-12">
                    <label for="locationDetail">Detalle de ubicación (opcional)</label>
                    <input pInputText id="locationDetail" formControlName="locationDetail" class="w-full" />
                </div>
            </div>
        </div>

        <div class="flex gap-2 justify-content-end">
            <button pButton type="button" label="Cancelar" class="p-button-text" (click)="cancel()"></button>
            <button pButton type="submit" [label]="isEditMode() ? 'Guardar cambios' : 'Crear organización'" [loading]="saving()" [disabled]="loading()"></button>
        </div>
    </form>
</div>
