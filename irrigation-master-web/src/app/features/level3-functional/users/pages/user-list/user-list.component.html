<div class="card">
    <p-toolbar styleClass="mb-4">
        <ng-template pTemplate="start">
            <h5 class="m-0">Usuarios</h5>
        </ng-template>
        <ng-template pTemplate="end">
            <p-select
                [options]="activeFilterOptions"
                optionLabel="label"
                optionValue="value"
                [ngModel]="activeFilter()"
                (ngModelChange)="activeFilter.set($event); onActiveFilterChange()"
                styleClass="mr-2"
            ></p-select>
            <button pButton type="button" label="Nuevo usuario" icon="pi pi-plus" routerLink="/users/new"></button>
        </ng-template>
    </p-toolbar>

    @if (errorMessage()) {
        <p-message severity="error" [text]="errorMessage()!" styleClass="mb-4 w-full"></p-message>
    }

    <p-table
        [value]="users()"
        [lazy]="true"
        [paginator]="true"
        [rows]="10"
        [totalRecords]="totalRecords()"
        [loading]="loading()"
        (onLazyLoad)="onLazyLoad($event)"
        dataKey="id"
        [rowsPerPageOptions]="[10, 20, 50]"
        responsiveLayout="scroll"
    >
        <ng-template pTemplate="header">
            <tr>
                <th>Nombre</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Andador</th>
                <th>Estado</th>
                <th style="width: 10rem"></th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-user>
            <tr>
                <td>{{ user.fullName }}</td>
                <td>{{ user.email }}</td>
                <td>{{ user.role }}</td>
                <td>{{ user.walkwayCode || '—' }}</td>
                <td>
                    <p-tag [severity]="user.isActive ? 'success' : 'warn'" [value]="user.isActive ? 'Activo' : 'Pendiente'"></p-tag>
                </td>
                <td>
                    <button pButton type="button" icon="pi pi-pencil" class="p-button-text p-button-rounded" [routerLink]="['/users', user.id]"></button>
                    @if (user.isActive) {
                        <button pButton type="button" icon="pi pi-ban" class="p-button-text p-button-rounded p-button-danger" (click)="confirmDeactivate(user)"></button>
                    } @else {
                        <button pButton type="button" icon="pi pi-check" class="p-button-text p-button-rounded p-button-success" (click)="activate(user)"></button>
                    }
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="6" class="text-center">No hay usuarios que mostrar.</td>
            </tr>
        </ng-template>
    </p-table>
</div>
